<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Puente</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
  /* Layout: app shell. Fixed sidebar (desktop) or top bar + bottom tabs (phone); one scrolling content column per view.
     Palette: chart paper and ink, one surgical-green accent. No gradients. */
  :root {
    --bg: #f2f4f3; --surface: #ffffff; --surface-2: #f6f8f7; --fg: #0f1714; --muted: #57635e; --line: #dde3e0;
    --accent: #0b6b57; --accent-fg: #ffffff; --accent-soft: #e2f0eb; --accent-ink: #08503f;
    --likely: #17784a; --likely-soft: #e3f4ea; --possible: #9a6200; --possible-soft: #fbf0dc;
    --unlikely: #6b7570; --unlikely-soft: #eceeed; --danger: #b42318; --warn-bg: #fff6e0; --warn-fg: #5c4300;
    --hero-bg: #0f1714; --hero-fg: #eef3f1; --hero-muted: #a9b7b1; --hero-line: #2a3631;
    --shadow: 0 1px 2px rgba(15, 23, 20, .05);
    --font-display: "Bricolage Grotesque", "Inter", system-ui, sans-serif;
    --font-body: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
    --font-mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
    --sidebar: 232px;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0c1110; --surface: #141b19; --surface-2: #19221f; --fg: #e7eeeb; --muted: #97a59f; --line: #25302c;
      --accent: #5fc4a6; --accent-fg: #06201a; --accent-soft: #163029; --accent-ink: #a6e3d0;
      --likely: #57c08b; --likely-soft: #16302a; --possible: #e3ad4c; --possible-soft: #33291a;
      --unlikely: #94a09b; --unlikely-soft: #202826; --danger: #f28b82; --warn-bg: #3a2f14; --warn-fg: #f0d58a;
      --hero-bg: #141b19; --hero-fg: #eef3f1; --hero-muted: #a9b7b1; --hero-line: #2a3631;
      --shadow: none; color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0c1110; --surface: #141b19; --surface-2: #19221f; --fg: #e7eeeb; --muted: #97a59f; --line: #25302c;
    --accent: #5fc4a6; --accent-fg: #06201a; --accent-soft: #163029; --accent-ink: #a6e3d0;
    --likely: #57c08b; --likely-soft: #16302a; --possible: #e3ad4c; --possible-soft: #33291a;
    --unlikely: #94a09b; --unlikely-soft: #202826; --danger: #f28b82; --warn-bg: #3a2f14; --warn-fg: #f0d58a;
    --hero-bg: #141b19; --hero-fg: #eef3f1; --hero-muted: #a9b7b1; --hero-line: #2a3631;
    --shadow: none; color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { min-height: 100%; }
  body { background: var(--bg); color: var(--fg); font: 15px/1.55 var(--font-body); }
  h1, h2, h3 { font-family: var(--font-display); margin: 0; text-wrap: balance; letter-spacing: -0.01em; }
  h1 { font-size: 1.75rem; font-weight: 800; line-height: 1.15; }
  h2 { font-size: 1.15rem; font-weight: 700; }
  h3 { font-size: 1rem; font-weight: 700; }
  p { margin: 0; }
  a { color: var(--accent); }
  button, input, textarea, select { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* Shell */
  .app { display: grid; grid-template-columns: var(--sidebar) minmax(0, 1fr); min-height: 100vh; }
  .side { position: sticky; top: 0; height: 100vh; border-right: 1px solid var(--line); background: var(--surface);
    padding: 20px 14px; display: flex; flex-direction: column; gap: 22px; }
  .brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--fg); padding: 0 8px; }
  .brand b { font: 800 1.25rem var(--font-display); letter-spacing: -0.02em; }
  .nav { display: flex; flex-direction: column; gap: 2px; }
  .nav a { display: flex; align-items: center; gap: 10px; padding: 9px 10px; border-radius: 8px; color: var(--muted); text-decoration: none; font-weight: 500; }
  .nav a:hover { background: var(--surface-2); color: var(--fg); }
  .nav a[aria-current="page"] { background: var(--accent-soft); color: var(--accent-ink); }
  .nav svg { width: 18px; height: 18px; flex: none; }
  .nav .count { margin-left: auto; font-size: .75rem; color: var(--muted); font-variant-numeric: tabular-nums; }
  .side .me { margin-top: auto; display: flex; align-items: center; gap: 10px; padding: 8px; font-size: .9rem; color: var(--muted); }
  .avatar { width: 28px; height: 28px; border-radius: 50%; object-fit: cover; flex: none; background: var(--surface-2); }
  .topbar, .tabs { display: none; }
  main { min-width: 0; }
  .view { max-width: 980px; margin: 0 auto; padding-block: 28px 80px;
    padding-left: max(24px, env(safe-area-inset-left, 0px)); padding-right: max(24px, env(safe-area-inset-right, 0px));
    display: flex; flex-direction: column; gap: 22px; }
  .view-head { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px; }
  .view-head .sub { color: var(--muted); margin-top: 4px; max-width: 62ch; }

  @media (max-width: 760px) {
    .app { grid-template-columns: minmax(0, 1fr); }
    .side { display: none; }
    body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
    .topbar { display: flex; align-items: center; justify-content: space-between; position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
      background: var(--surface); border-bottom: 1px solid var(--line); padding-block: 10px;
      padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
    .tabs { display: grid; grid-template-columns: repeat(4, 1fr); position: fixed; inset: auto 0 0 0; z-index: 5; background: var(--surface);
      border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px);
      padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); }
    .tabs a { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 8px 4px; font-size: .72rem; color: var(--muted); text-decoration: none; }
    .tabs a[aria-current="page"] { color: var(--accent); }
    .tabs svg { width: 20px; height: 20px; }
    .view { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 20px 110px; }
    h1 { font-size: 1.45rem; }
  }

  /* Building blocks */
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 18px; box-shadow: var(--shadow); min-width: 0; }
  .stack { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .grid-2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 16px; }
  .grid-3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; }
  .label { font-size: .75rem; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .07em; }
  .muted { color: var(--muted); }
  .small { font-size: .87rem; }
  .mono { font-family: var(--font-mono); font-size: .82rem; }
  .btn { display: inline-flex; align-items: center; gap: 8px; border-radius: 9px; padding: 9px 15px; cursor: pointer; border: 1px solid var(--line);
    background: var(--surface); color: var(--fg); font-weight: 500; text-decoration: none; white-space: nowrap; }
  .btn:hover { background: var(--surface-2); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); font-weight: 600; }
  .btn.primary:hover { filter: brightness(1.07); }
  .btn.ghost { border-color: transparent; background: transparent; color: var(--accent); padding-inline: 8px; }
  .btn.danger { color: var(--danger); }
  .btn:disabled { opacity: .5; cursor: not-allowed; }
  .btn svg { width: 16px; height: 16px; }
  .field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
  .field label { font-weight: 600; font-size: .9rem; }
  input[type="text"], textarea, select { width: 100%; padding: 10px 12px; border: 1px solid var(--line); border-radius: 9px; background: var(--surface); }
  textarea { min-height: 140px; resize: vertical; line-height: 1.5; }
  .notice { background: var(--warn-bg); color: var(--warn-fg); border-radius: 10px; padding: 10px 14px; font-size: .9rem; }
  .error { color: var(--danger); }
  .pill { display: inline-flex; align-items: center; gap: 6px; font-size: .75rem; font-weight: 600; padding: 3px 9px; border-radius: 999px;
    background: var(--unlikely-soft); color: var(--unlikely); text-transform: uppercase; letter-spacing: .05em; }
  .pill[data-tone="likely"], .pill[data-tone="open"] { background: var(--likely-soft); color: var(--likely); }
  .pill[data-tone="possible"] { background: var(--possible-soft); color: var(--possible); }
  .chip { font-size: .78rem; padding: 2px 9px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
  dl.facts { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 8px 18px; margin: 0; }
  dl.facts dt { color: var(--muted); font-size: .9rem; } dl.facts dd { margin: 0; overflow-wrap: anywhere; }
  ul.list { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 5px; }
  .empty { text-align: center; padding: 40px 18px; display: flex; flex-direction: column; align-items: center; gap: 10px; }
  .empty svg { width: 40px; height: 40px; color: var(--muted); }
  .empty p { max-width: 44ch; color: var(--muted); }
  details summary { cursor: pointer; color: var(--accent); font-weight: 500; }
  details[open] summary { margin-bottom: 8px; }
  .clickable { cursor: pointer; text-decoration: none; color: inherit; display: block; transition: border-color .15s; }
  .clickable:hover { border-color: var(--accent); }

  /* Home */
  .hero { border-radius: 14px; padding: 36px; color: var(--hero-fg); background: var(--hero-bg);
    display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 32px; align-items: center; }
  .hero .copy { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
  .hero h1 { font-size: 2.5rem; line-height: 1.05; max-width: 15ch; color: var(--hero-fg); font-weight: 800; }
  .hero p { max-width: 52ch; color: var(--hero-muted); font-size: 1.02rem; }
  .hero .kicker { font: 500 .78rem var(--font-mono); color: var(--hero-muted); letter-spacing: .04em; }
  .hero .btn { border-color: var(--hero-line); background: transparent; color: var(--hero-fg); }
  .hero .btn:hover { background: var(--hero-line); }
  .hero .btn.primary { background: var(--hero-fg); color: var(--hero-bg); border-color: var(--hero-fg); }
  .demo { background: var(--surface); color: var(--fg); border-radius: 10px; padding: 16px; display: flex; flex-direction: column; gap: 10px;
    border: 1px solid var(--hero-line); min-width: 0; }
  .demo p { color: var(--fg); }
  .demo p.muted { color: var(--muted); }
  .demo .quote { font-size: .88rem; color: var(--muted); border-left: 2px solid var(--line); padding-left: 10px; font-style: italic; }
  .demo .trial { padding: 12px; border: 1px solid var(--line); border-radius: 8px; box-shadow: none; }
  .facts-line { display: flex; flex-wrap: wrap; gap: 6px 28px; padding: 14px 0; border-block: 1px solid var(--line); }
  .facts-line div { display: flex; align-items: baseline; gap: 8px; }
  .facts-line b { font: 700 1.25rem var(--font-display); font-variant-numeric: tabular-nums; }
  @media (max-width: 900px) { .hero { grid-template-columns: minmax(0, 1fr); padding: 26px 20px; } .hero h1 { font-size: 1.9rem; } }
  .pillar { display: flex; flex-direction: column; gap: 10px; }
  .pillar .ic { width: 38px; height: 38px; border-radius: 10px; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; }
  .pillar .ic svg { width: 20px; height: 20px; }
  .flow { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 0; counter-reset: step; }
  .flow > div { padding: 16px 18px; border-left: 2px solid var(--line); counter-increment: step; }
  .flow > div::before { content: counter(step); font: 800 .8rem var(--font-display); color: var(--accent); display: block; margin-bottom: 4px; }

  /* Trials */
  .trial { border-left: 4px solid var(--unlikely); display: flex; flex-direction: column; gap: 9px; }
  .trial[data-fit="likely"] { border-left-color: var(--likely); }
  .trial[data-fit="possible"] { border-left-color: var(--possible); }
  .trial .t-title { font-weight: 600; }
  .steps { display: flex; flex-direction: column; gap: 6px; }
  .steps div { color: var(--muted); display: flex; gap: 8px; align-items: center; }
  .steps div[data-state="active"] { color: var(--fg); font-weight: 500; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--line); flex: none; }
  .steps div[data-state="active"] .dot { background: var(--accent); animation: pulse 1.2s ease-in-out infinite; }
  .steps div[data-state="done"] .dot { background: var(--likely); }
  @keyframes pulse { 50% { opacity: .3; } }
  @media (prefers-reduced-motion: reduce) { .steps div[data-state="active"] .dot { animation: none; } .clickable { transition: none; } }

  /* Tumor board */
  .opinion { display: flex; gap: 12px; align-items: flex-start; }
  .opinion .body { display: flex; flex-direction: column; gap: 6px; min-width: 0; flex: 1; }
  .opinion .who { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: baseline; }
  .opinion .who b { font-weight: 600; }
  .brief { background: var(--accent-soft); border: 1px solid transparent; }
  .split { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 18px; align-items: start; }
  @media (max-width: 900px) { .split { grid-template-columns: minmax(0, 1fr); } }
  .tablewrap { overflow-x: auto; }
  table { border-collapse: collapse; width: 100%; font-size: .92rem; }
  th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { font-size: .75rem; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; font-weight: 600; }
  tr.rowlink { cursor: pointer; } tr.rowlink:hover td { background: var(--surface-2); }
</style>

<div class="app">
  <aside class="side">
    <a class="brand" href="#home" aria-label="Puente home">
      <svg width="30" height="30" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="8" fill="var(--accent)"/><path d="M5 22c3.5-8 18.5-8 22 0" stroke="var(--accent-fg)" stroke-width="2.6" fill="none" stroke-linecap="round"/><path d="M9 22v-4M16 22v-6M23 22v-4" stroke="var(--accent-fg)" stroke-width="2" stroke-linecap="round"/></svg>
      <b>Puente</b>
    </a>
    <nav class="nav" id="side-nav"></nav>
    <div class="me" id="me-box"></div>
  </aside>

  <main>
    <header class="topbar">
      <a class="brand" href="#home">
        <svg width="26" height="26" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="8" fill="var(--accent)"/><path d="M5 22c3.5-8 18.5-8 22 0" stroke="var(--accent-fg)" stroke-width="2.6" fill="none" stroke-linecap="round"/><path d="M9 22v-4M16 22v-6M23 22v-4" stroke="var(--accent-fg)" stroke-width="2" stroke-linecap="round"/></svg>
        <b>Puente</b>
      </a>
      <span id="me-top"></span>
    </header>
    <div id="view"></div>
  </main>
  <nav class="tabs" id="tab-nav"></nav>
</div>

<script>
/* ---------------- constants ---------------- */
const ICONS = {
  home: '<path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/>',
  match: '<circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3M8 11h6M11 8v6"/>',
  patients: '<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0M16 4.5a3.5 3.5 0 0 1 0 7M21.5 20a6.5 6.5 0 0 0-4-6"/>',
  boards: '<rect x="3" y="4" width="18" height="13" rx="2"/><path d="M7 21h10M12 17v4M7 9h6M7 12h10"/>',
  plus: '<path d="M12 5v14M5 12h14"/>',
  back: '<path d="M15 18l-6-6 6-6"/>',
  doc: '<path d="M7 3h7l5 5v13H7z"/><path d="M14 3v5h5M10 13h6M10 17h6"/>',
  globe: '<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/>',
  chat: '<path d="M4 5h16v11H9l-5 4z"/>',
  spark: '<path d="M12 3v4M12 17v4M3 12h4M17 12h4M6 6l2.5 2.5M15.5 15.5L18 18M6 18l2.5-2.5M15.5 8.5L18 6"/>',
};
const icon = (name) => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[name]}</svg>`;
const NAV = [["home", "Home"], ["match", "Matcher"], ["patients", "Patients"], ["boards", "Tumor boards"]];
const SAMPLES = {
  es: "Paciente femenina de 58 años, vive en Asunción, Paraguay. Diagnóstico de adenocarcinoma de pulmón (cáncer de pulmón de células no pequeñas) estadio IV con metástasis óseas, diagnosticado hace 14 meses. Mutación EGFR deleción del exón 19. Recibió osimertinib durante 12 meses con progresión de la enfermedad en la última tomografía. ECOG 1. Sin metástasis cerebrales. Hipertensión controlada. Nunca fumó.",
  pt: "Paciente de 46 anos, sexo feminino, mora em Curitiba, Brasil. Câncer de mama HER2 positivo, receptores hormonais negativos, estágio IV com metástases hepáticas. Tratada com trastuzumabe e pertuzumabe com docetaxel na primeira linha e depois trastuzumabe deruxtecan, com progressão. ECOG 0. Função cardíaca normal (FEVE 60%).",
  en: "62-year-old man living in Lima, Peru. Metastatic colorectal adenocarcinoma with liver and lung metastases. KRAS G12C mutation, microsatellite stable. Progressed after FOLFOX plus bevacizumab and then FOLFIRI. ECOG 1. Mild type 2 diabetes.",
};
const REGIONS = {
  "South America": ["Argentina","Bolivia","Brazil","Chile","Colombia","Ecuador","Guyana","Paraguay","Peru","Suriname","Uruguay","Venezuela"],
  "Central America & Caribbean": ["Mexico","Guatemala","Belize","Honduras","El Salvador","Nicaragua","Costa Rica","Panama","Cuba","Dominican Republic","Puerto Rico","Jamaica","Haiti"],
  "North America": ["United States","Canada"],
};
const SPECIALTIES = ["Medical oncology", "Radiation oncology", "Surgical oncology", "Thoracic surgery", "Pathology", "Radiology", "Hematology", "Pediatric oncology", "Palliative care", "Clinical trials"];
const MAX_CANDIDATES = 8, MAX_CRITERIA_CHARS = 12000;
const PROX_LABEL = { same_country: "Sites in patient's country", same_region: "Sites in patient's region", abroad: "Sites in other regions" };
const FIT_RANK = { likely: 0, possible: 1, unlikely: 2 }, PROX_RANK = { same_country: 0, same_region: 1, abroad: 2 };

/* ---------------- tiny DOM helpers ---------------- */
const $ = (sel, root = document) => root.querySelector(sel);
function h(tag, props = {}, ...kids) {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(props || {})) {
    if (v == null || v === false) continue;
    if (k === "class") n.className = v;
    else if (k === "html") n.innerHTML = v;            // only ever used with our own static icon markup
    else if (k.startsWith("on")) n.addEventListener(k.slice(2), v);
    else if (k === "dataset") Object.assign(n.dataset, v);
    else if (k in n && typeof v !== "string") n[k] = v;
    else n.setAttribute(k, v);
  }
  for (const kid of kids.flat()) if (kid != null && kid !== false) n.append(kid instanceof Node ? kid : String(kid));
  return n;
}
const ic = (name) => h("span", { html: icon(name), style: "display:inline-flex" });
const list = (items) => items?.length ? h("ul", { class: "list" }, items.map((i) => h("li", {}, String(i)))) : h("p", { class: "muted small" }, "None");
const newId = () => (crypto.randomUUID?.() || Math.random().toString(16).slice(2) + Date.now().toString(16)).replace(/-/g, "").slice(0, 14);
const now = () => new Date().toISOString();
function ago(iso) {
  const s = (Date.now() - Date.parse(iso)) / 1000;
  if (!isFinite(s)) return "";
  if (s < 60) return "just now";
  const m = s / 60; if (m < 60) return `${Math.floor(m)} min ago`;
  const hr = m / 60; if (hr < 24) return `${Math.floor(hr)} h ago`;
  const d = hr / 24; if (d < 30) return `${Math.floor(d)} d ago`;
  return new Date(iso).toLocaleDateString();
}
const safeUrl = (u) => typeof u === "string" && /^(https:|data:image\/|\/_blob\/)/.test(u) ? u : "";

/* ---------------- state ---------------- */
const S = {
  trials: [], byId: new Map(), snapshotDate: "", countries: 0,
  db: null, user: null, sample: null, me: null, canWrite: true,
  patients: [], boards: [], opinions: [], loaded: { patients: false, boards: false, opinions: false }, dbError: "",
  match: { text: "", running: false, step: "", error: "", result: null, ctl: null, forPatient: null },
  drafts: {},
};

/* ---------------- matching (Claude via the viewer's account) ---------------- */
function regionOf(country) {
  if (!country) return null;
  const c = String(country).trim().toLowerCase();

  if (text.length > 20000) { M.error = "That summary is very long. Shorten it to the key facts."; return renderView(); }
  M.ctl = new AbortController(); M.running = true; M.error = ""; M.result = null; M.step = "read"; renderView();
  try {
    const first = await S.sample.json(readPrompt(text), { signal: M.ctl.signal });
    const c = first?.case;
    if (!c || typeof c !== "object") throw { code: "invalid_json" };
    let matches = [], second = {};
    if (c.is_cancer_case !== false) {
      const ids = [...new Set((Array.isArray(first.candidates) ? first.candidates : []).map(String))].filter((id) => S.byId.has(id)).slice(0, MAX_CANDIDATES);
      const picks = ids.map((id) => { const t = S.byId.get(id); return { t, p: proximity(t, c.country) }; });
      if (picks.length) {

        }).sort((x, y) => FIT_RANK[x.fit] - FIT_RANK[y.fit] || PROX_RANK[x.proximity] - PROX_RANK[y.proximity]);

    alias.addEventListener("input", (e) => { S.drafts.alias = e.target.value; });
    const msg = h("p", { class: "small error" });
    const save = h("button", { class: "btn primary", disabled: !S.db || !S.canWrite, onclick: async () => {
      if (!alias.value.trim()) { msg.textContent = "Give the patient a code or initials (no full names)."; return; }
      save.disabled = true; msg.textContent = "";
      try { await savePatient(alias.value); S.drafts.alias = ""; } catch (e) { msg.textContent = dbFail(e); save.disabled = false; }
    } }, S.match.forPatient ? "Update patient profile" : "Save as patient");
    out.push(h("div", { class: "card stack" }, h("h2", {}, "Save this case"),
      h("div", { class: "row", style: "align-items:flex-end" }, h("div", { class: "field", style: "flex:1;min-width:200px" }, h("label", { for: "alias" }, "Patient code"), alias), save),
      !S.db ? h("p", { class: "muted small" }, "Saving works when this app is opened in Claude while signed in.") : null, msg));
  }
  out.push(h("h2", {}, "The case"), h("div", { class: "card" }, caseFacts(R.case)));
  if (R.case.is_cancer_case === false) { out.push(h("p", {}, "This doesn't read as a cancer case, so no trials were checked.")); return out; }
  if (!R.matches.length) { out.push(h("div", { class: "card empty" }, h("p", {}, "No trial in this snapshot fits this case. Puente's full engine also searches trials worldwide."))); return out; }
  if (R.message) out.push(h("h2", {}, "For the patient and family"), h("div", { class: "card" }, h("p", { style: "font-size:1.02rem" }, R.message)));
  out.push(h("h2", {}, `Trials to discuss (${R.matches.length})`), ...R.matches.map(trialCard),
    h("div", { class: "grid-2" },
      h("div", { class: "card stack" }, h("h3", {}, "Questions for the oncologist"), list(R.questions)),
      h("div", { class: "card stack" }, h("h3", {}, "Before enrolling"), list(R.checklist))));
  return out;
}

function viewPatients() {

  return h("div", { class: "view" }, head("Patients", "Every saved case, with its matched trials and tumor boards.", newBtn),
    loadingOr("patients", () => {
      if (!S.patients.length) return h("div", { class: "card empty", html: "" },

        h("p", {}, "Run the matcher on a case and save it. It shows up here with its trials, the family explanation and the enrollment checklist."),

      return h("div", { class: "card tablewrap", style: "padding:0" }, h("table", {},
        h("thead", {}, h("tr", {}, ...["Patient", "Cancer", "Location", "Trials", "Boards", "Updated"].map((x) => h("th", {}, x)))),
        h("tbody", {}, ...S.patients.map((p) => {

            h("td", {}, h("b", {}, p.alias || "Unnamed")), h("td", {}, [c.cancer_type, c.stage && `stage ${c.stage}`].filter(Boolean).join(", ") || "–"),
            h("td", {}, c.country || "–"), h("td", {}, `${(p.matches || []).length}${likely ? ` · ${likely} likely` : ""}`),
            h("td", {}, String(boards)), h("td", { class: "muted" }, ago(p.updated_at)));
        }))));
    }));
}

function viewPatient(r) {
  return h("div", { class: "view" }, loadingOr("patients", () => {
    const p = S.patients.find((x) => x.id === r.id);
    if (!p) return h("div", { class: "card empty" }, h("h3", {}, "Patient not found"), h("p", {}, "It may have been deleted."), h("a", { class: "btn", href: "#patients" }, "Back to patients"));
    const boards = S.boards.filter((b) => b.patient_id === p.id);
    const R = { text: p.text, case: p.case || {}, matches: p.matches || [], message: p.message, questions: p.questions, checklist: p.checklist };
    const rerun = h("button", { class: "btn", disabled: !S.sample, onclick: () => { S.match = { ...S.match, text: p.text, result: null, error: "", forPatient: p.id }; S.drafts.alias = p.alias; go("match"); } }, ic("match"), "Re-run matching");

    const del = h("button", { class: "btn danger ghost", disabled: !S.canWrite, onclick: () => { S.drafts.confirmDelete = p.id; renderView(); } }, "Delete");
    const box = h("div", { class: "stack", style: "gap:22px" },
      h("a", { class: "btn ghost", href: "#patients", style: "align-self:flex-start;padding-left:0" }, ic("back"), "Patients"),
      head(p.alias || "Patient", [p.case?.cancer_type, p.case?.country].filter(Boolean).join(" · ") + (p.updated_at ? ` · updated ${ago(p.updated_at)}` : ""), rerun, toBoard, del));
    if (S.drafts.confirmDelete === p.id) box.append(h("div", { class: "card row", style: "justify-content:space-between" }, h("span", {}, `Delete ${p.alias}? Tumor boards for this patient stay.`),
      h("div", { class: "row" }, h("button", { class: "btn", onclick: () => { S.drafts.confirmDelete = null; renderView(); } }, "Cancel"),
        h("button", { class: "btn primary", onclick: async () => { try { await S.db.collection("patients").doc(p.id).delete(); S.drafts.confirmDelete = null; go("patients"); } catch (e) { alertInline(box, dbFail(e)); } } }, "Delete"))));
    if (S.drafts.newBoardFor === p.id) box.append(newBoardForm(p));

      h("details", { class: "card" }, h("summary", {}, "Original summary"), h("p", { style: "white-space:pre-wrap" }, p.text || "")));
    return box;
  }));
}
function alertInline(root, msg) { root.prepend(h("p", { class: "error" }, msg)); }

function newBoardForm(p) {
  const d = S.drafts.board ||= { question: "", specialties: ["Medical oncology"] };
  const q = h("textarea", { id: "question", placeholder: "What do you want the board to weigh in on? e.g. Best next line after osimertinib progression; is any of these trials worth referring her to?", style: "min-height:100px", oninput: (e) => { d.question = e.target.value; } });
  q.value = d.question;
  const msg = h("p", { class: "small error" });
  const specs = h("div", { class: "row" }, ...SPECIALTIES.map((s) => {
    const on = d.specialties.includes(s);
    return h("button", { class: "btn", type: "button", "aria-pressed": String(on), style: on ? "border-color:var(--accent);color:var(--accent-ink);background:var(--accent-soft)" : "",

}

function viewBoard(r) {
  return h("div", { class: "view" }, loadingOr("boards", () => {
    const b = S.boards.find((x) => x.id === r.id);

    const ops = S.opinions.filter((o) => o.board_id === b.id);
    const mine = S.me?.id && b.created_by === S.me.id;
    const toggle = h("button", { class: "btn", disabled: !S.canWrite, onclick: async () => {
      try { await S.db.collection("boards").doc(b.id).update({ status: b.status === "open" ? "closed" : "open" }); } catch (e) { alertInline(left, dbFail(e)); }
    } }, b.status === "open" ? "Close board" : "Reopen");
    const left = h("div", { class: "stack", style: "gap:18px" });
    const right = h("div", { class: "stack", style: "gap:18px" });

    left.append(h("div", { class: "card stack" }, h("div", { class: "label" }, "Question from the treating doctor"), h("p", { style: "font-size:1.05rem;white-space:pre-wrap" }, b.question),

    if (b.brief) left.append(h("div", { class: "card brief stack" }, h("div", { class: "row" }, h("span", { html: icon("spark"), style: "display:inline-flex;width:18px;color:var(--accent)" }), h("h3", {}, "Case brief")),
      b.brief.one_liner ? h("p", {}, b.brief.one_liner) : null,
      h("div", { class: "grid-2" }, h("div", {}, h("div", { class: "label" }, "Key facts"), list(b.brief.key_facts)), h("div", {}, h("div", { class: "label" }, "Treatment so far"), list(b.brief.treatment_history))),
      h("div", {}, h("div", { class: "label" }, "For the board to weigh"), list(b.brief.open_questions)),
      h("p", { class: "muted small" }, "Prepared by Claude from the record. Check it against the case below.")));
    else left.append(h("div", { class: "card brief row", style: "justify-content:space-between" }, h("span", { class: "muted" }, "No case brief yet."),
      h("button", { class: "btn", disabled: !S.sample || !S.canWrite, onclick: async (e) => { e.target.disabled = true; e.target.textContent = "Preparing…"; try { await prepareBrief(b.id, b); } catch (err) { e.target.textContent = "Try again"; e.target.disabled = false; alertInline(left, err?.code ? sampleError(err) : dbFail(err)); } } }, "Prepare brief")));

    // Opinions
    left.append(h("h2", {}, `Opinions (${ops.length})`));
    if (!ops.length) left.append(h("p", { class: "muted" }, "No opinions yet. Specialists you share Puente with can add theirs here."));
    const opList = h("div", { class: "stack" });
    left.append(opList);
    const ids = [...new Set(ops.map((o) => o.author).filter(Boolean))];
    const drawOps = (profiles = {}) => opList.replaceChildren(...ops.map((o) => {
      const pr = profiles[o.author] || {};
      return h("div", { class: "card opinion" }, h("img", { class: "avatar", src: safeUrl(pr.avatarUrl), alt: "", style: "width:36px;height:36px" }),
        h("div", { class: "body" }, h("div", { class: "who" }, h("b", {}, pr.name || "A specialist"), h("span", { class: "chip" }, o.specialty || "Specialist"), h("span", { class: "muted small" }, ago(o.created_at))),
          h("p", { style: "white-space:pre-wrap" }, o.recommendation),
          o.trials_view ? h("div", {}, h("div", { class: "label" }, "On the trials"), h("p", { class: "small", style: "white-space:pre-wrap" }, o.trials_view)) : null));
    }));
    drawOps();
    if (ids.length && S.user) S.user.profiles(ids).then(drawOps).catch(() => {});

    // Consensus
    if (ops.length >= 2 || b.consensus) {
      const stale = b.consensus && b.consensus.opinion_count !== ops.length;
      const btn = h("button", { class: "btn", disabled: !S.sample || !S.canWrite || ops.length < 2, onclick: async () => {
        btn.disabled = true; btn.textContent = "Summarizing…";
        try { await summarizeBoard(b, ops); } catch (e) { btn.disabled = false; btn.textContent = "Try again"; alertInline(left, e?.code ? sampleError(e) : dbFail(e)); }
      } }, b.consensus ? "Update summary" : "Summarize opinions");
      left.append(h("div", { class: "card brief stack" }, h("div", { class: "row", style: "justify-content:space-between" }, h("h3", {}, "Where the board stands"), btn),
        b.consensus ? h("div", { class: "stack" },
          h("div", {}, h("div", { class: "label" }, "Agreement"), list(b.consensus.agreement)),
          h("div", {}, h("div", { class: "label" }, "Disagreement"), list(b.consensus.disagreement)),
          h("div", {}, h("div", { class: "label" }, "Next steps"), list(b.consensus.next_steps)),
          h("p", { class: "muted small" }, `Summarized by Claude from ${b.consensus.opinion_count} opinion${b.consensus.opinion_count === 1 ? "" : "s"}${stale ? "; new opinions since, update it" : ""}.`))
          : h("p", { class: "muted small" }, "Claude summarizes where the specialists agree, where they differ, and the next steps they call for.")));
    }

    // Add opinion form
    if (b.status === "open") {
      const d = S.drafts[`op-${b.id}`] ||= { specialty: "Medical oncology", recommendation: "", trials: "" };
      const sel = h("select", { id: "op-specialty", onchange: (e) => { d.specialty = e.target.value; } }, ...SPECIALTIES.map((s) => h("option", { value: s, selected: d.specialty === s }, s)));
      const rec = h("textarea", { id: "op-rec", placeholder: "Your recommendation and reasoning.", oninput: (e) => { d.recommendation = e.target.value; } }); rec.value = d.recommendation;
      const tv = h("textarea", { id: "op-trials", style: "min-height:70px", placeholder: "Optional: which of the matched trials, if any, you'd refer to and why.", oninput: (e) => { d.trials = e.target.value; } }); tv.value = d.trials;
      const msg = h("p", { class: "small error" });
      const post = h("button", { class: "btn primary", disabled: !S.db || !S.canWrite, onclick: async () => {
        if (!d.recommendation.trim()) { msg.textContent = "Write your recommendation first."; return; }
        post.disabled = true;
        try { await addOpinion(b, d); S.drafts[`op-${b.id}`] = null; renderView(); } catch (e) { msg.textContent = dbFail(e); post.disabled = false; }
      } }, ic("chat"), "Post opinion");
      left.append(h("div", { class: "card stack" }, h("h2", {}, "Add your opinion"),
        h("div", { class: "field" }, h("label", { for: "op-specialty" }, "Your specialty"), sel),
        h("div", { class: "field" }, h("label", { for: "op-rec" }, "Recommendation"), rec),
        h("div", { class: "field" }, h("label", { for: "op-trials" }, "On the trials"), tv),
        h("div", { class: "row" }, post, h("span", { class: "muted small" }, "Posted under your name. The treating doctor decides.")), msg));
    }

    // Right column: case + trials
    right.append(h("div", { class: "card stack" }, h("h3", {}, "The case"), caseFacts(b.case || {}),
      h("details", {}, h("summary", {}, "Original summary"), h("p", { class: "small", style: "white-space:pre-wrap" }, b.text || "")),
      h("a", { class: "btn ghost", href: `#patient-${b.patient_id}`, style: "align-self:flex-start;padding-left:0" }, "Open patient profile →")));
    if (b.matches?.length) right.append(h("div", { class: "card stack" }, h("h3", {}, "Matched trials"),
      ...b.matches.map((m) => { const t = S.byId.get(m.id); return h("div", { class: "stack", style: "gap:4px" },
        h("div", { class: "row" }, h("span", { class: "pill", "data-tone": m.fit }, m.fit), h("a", { class: "mono", href: `https://clinicaltrials.gov/study/${encodeURIComponent(m.id)}`, target: "_blank", rel: "noopener" }, m.id)),
        h("span", { class: "small" }, t?.title || "")); })));

    return h("div", { class: "stack", style: "gap:22px" },
      h("a", { class: "btn ghost", href: "#boards", style: "align-self:flex-start;padding-left:0" }, ic("back"), "Tumor boards"),
      head(`Tumor board · ${b.patient_alias || "Patient"}`, [b.case?.cancer_type, b.case?.country, `posted ${ago(b.created_at)}`].filter(Boolean).join(" · "),
        h("span", { class: "pill", "data-tone": b.status }, b.status), (mine || S.me?.isOwner) ? toggle : null),
      h("div", { class: "split" }, left, right));
  }));
}

function viewSettings() {
  const wrap = h("div", { class: "view" }, head("Settings", "This copy of Puente runs on its own, outside Claude."));
  if (!S.standalone) { wrap.append(h("div", { class: "card" }, h("p", {}, "Inside Claude, Puente uses your Claude account and a workspace shared with the people you invite. Nothing to set up."))); return wrap; }
  const P = window.PuenteStandalone;
  const has = !!P.getKey();

  const msg = h("p", { class: "small" });
  wrap.append(h("div", { class: "card stack" }, h("h2", {}, "Anthropic API key"),
    h("p", { class: "muted small" }, "Matching and case briefs call Claude with your own key. It's saved only in this browser and sent only to Anthropic. Get one at console.anthropic.com → API keys, and add a few dollars of credit."),
    h("div", { class: "field" }, h("label", { for: "api-key" }, "API key"), input),
    h("div", { class: "row" },
      h("button", { class: "btn primary", onclick: () => {
        const v = input.value.trim();
        if (!/^sk-ant-/.test(v)) { msg.className = "small error"; msg.textContent = "That doesn't look like an Anthropic key. It starts with sk-ant-."; return; }
        P.setKey(v); S.sample = P.makeSample(v); input.value = ""; msg.className = "small"; msg.textContent = "Saved. You can run the matcher now."; renderShell();
      } }, "Save key"),
      has ? h("button", { class: "btn danger", onclick: () => { P.setKey(""); S.sample = null; renderView(); } }, "Remove key") : null),
    msg),
    h("div", { class: "card stack" }, h("h2", {}, "Where your data lives"),
      h("p", { class: "muted small" }, "Patients and tumor boards you create here are saved in this browser only. To work with other doctors on shared tumor boards, use the Claude version of Puente and share it with them."),
      h("p", { class: "muted small" }, "Never paste real names or ID numbers. Use initials or a code.")));
  return wrap;
}

/* ---------------- boot ---------------- */
renderShell(); renderView();

(async () => {
  try {
    const data = await (await fetch("trials.json")).json();
    S.trials = data.trials; S.byId = new Map(S.trials.map((t) => [t.id, t])); S.snapshotDate = data.generated_at;
    S.countries = new Set(S.trials.flatMap((t) => t.sites.map((s) => s[2]))).size;
  } catch { S.snapshotDate = ""; }
  scheduleRender();
})();

(async () => {
  if (!window.claude) return bootStandalone();
  const [sample, db, user] = await Promise.all([claude.use("sample"), claude.use("db"), claude.use("user")]);
  S.sample = sample; S.user = user;
  if (user) { S.me = await user.me(); const cw = await user.can("data.write"); if (cw === false) S.canWrite = false; }
  if (db) {
    S.db = db;
    const timer = setTimeout(() => { if (!S.loaded.patients) { S.dbError = "Can't reach saved data yet. Check your connection; it will load when it can."; scheduleRender(); } }, 10000);
    const sub = (name, q, key) => q.onSnapshot((snap) => {
      S[key] = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
      if (!snap.metadata.fromCache) { S.loaded[key] = true; if (key === "patients") { clearTimeout(timer); S.dbError = ""; } }
      else if (snap.size) S.loaded[key] = true;
      scheduleRender();
    }, (e) => { S.loaded[key] = true; if (e?.code !== "revoked") S.dbError = "Saved data couldn't load. Reload to try again."; clearTimeout(timer); scheduleRender(); });
    sub("patients", db.collection("patients").orderBy("updated_at", "desc"), "patients");
    sub("boards", db.collection("boards").orderBy("created_at", "desc"), "boards");
    sub("opinions", db.collection("opinions").orderBy("created_at", "asc"), "opinions");
  }
  scheduleRender();
})();

/* Outside Claude (GitHub Pages, a local file server): your own API key, data in this browser. */
async function bootStandalone() {
  S.standalone = true;
  await new Promise((resolve) => {
    const s = document.createElement("script");
    s.src = "standalone.js"; s.onload = resolve; s.onerror = resolve;
    document.head.append(s);
  });
  const P = window.PuenteStandalone;
  if (!P) { scheduleRender(); return; }
  const key = P.getKey();
  S.sample = key ? P.makeSample(key) : null;
  S.user = P.makeUser(); S.me = await S.user.me();
  const db = P.makeDb(); S.db = db;
  for (const [key, field, dir] of [["patients", "updated_at", "desc"], ["boards", "created_at", "desc"], ["opinions", "created_at", "asc"]]) {
    db.collection(key).orderBy(field, dir).onSnapshot((snap) => {
      S[key] = snap.docs.map((d) => ({ id: d.id, ...d.data() })); S.loaded[key] = true; scheduleRender();
    });
  }
  scheduleRender();
}
