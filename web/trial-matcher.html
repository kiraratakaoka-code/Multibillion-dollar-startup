<title>Eligo</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  /* Clinical software, not a landing page: white work surfaces on light grey, one navy accent, 1px rules,
     small radii, no shadows or gradients, dense type in one family. Layout: top bar, then a single work column. */
  :root {
    --bg: #f5f6f8; --surface: #ffffff; --surface-2: #f8f9fb; --fg: #1a1f26; --muted: #5f6873; --faint: #8a929c; --line: #dfe3e8; --line-strong: #c9cfd6;
    --accent: #1f3f6e; --accent-fg: #ffffff; --accent-soft: #edf2f8; --accent-ink: #1f3f6e; --link: #1f4f8f;
    --likely: #1e6b45; --possible: #8a5a00; --unlikely: #6a737d; --open: #1e6b45;
    --danger: #a3261b; --warn-bg: #fdf6e7; --warn-fg: #5a4210; --warn-line: #ecd9a8;
    --font-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
    --font-display: var(--font-body);
    --font-mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #111418; --surface: #181c21; --surface-2: #1d2228; --fg: #e3e7ec; --muted: #9aa3ad; --faint: #737c86; --line: #2a3038; --line-strong: #3a424c;
      --accent: #8fb0dd; --accent-fg: #0e1725; --accent-soft: #1d2735; --accent-ink: #b9cfee; --link: #9fbde6;
      --likely: #6cc497; --possible: #e0b25a; --unlikely: #97a0aa; --open: #6cc497;
      --danger: #f08b80; --warn-bg: #2a2416; --warn-fg: #ecd59a; --warn-line: #4a3f22; color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #111418; --surface: #181c21; --surface-2: #1d2228; --fg: #e3e7ec; --muted: #9aa3ad; --faint: #737c86; --line: #2a3038; --line-strong: #3a424c;
    --accent: #8fb0dd; --accent-fg: #0e1725; --accent-soft: #1d2735; --accent-ink: #b9cfee; --link: #9fbde6;
    --likely: #6cc497; --possible: #e0b25a; --unlikely: #97a0aa; --open: #6cc497;
    --danger: #f08b80; --warn-bg: #2a2416; --warn-fg: #ecd59a; --warn-line: #4a3f22; color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { min-height: 100%; }
  body { background: var(--bg); color: var(--fg); font: 14px/1.5 var(--font-body); -webkit-font-smoothing: antialiased; }
  h1, h2, h3 { font-family: var(--font-body); margin: 0; font-weight: 600; letter-spacing: 0; }
  h1 { font-size: 1.3rem; line-height: 1.3; }
  h2 { font-size: 1rem; }
  h3 { font-size: .93rem; }
  p { margin: 0; }
  a { color: var(--link); text-underline-offset: 2px; }
  button, input, textarea, select { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

  /* Top bar */
  body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
  .topnav { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--surface); border-bottom: 1px solid var(--line); }
  .topnav .inner { max-width: 1160px; margin: 0 auto; display: flex; align-items: center; gap: 24px; height: 52px;
    padding-left: max(24px, env(safe-area-inset-left, 0px)); padding-right: max(24px, env(safe-area-inset-right, 0px)); }
  .brand { display: flex; align-items: center; gap: 8px; text-decoration: none; color: var(--fg); flex: none; }
  .brand b { font-weight: 600; font-size: 1.05rem; }
  .nav { display: flex; align-items: stretch; gap: 4px; height: 100%; min-width: 0; overflow-x: auto; scrollbar-width: none; }
  .nav::-webkit-scrollbar { display: none; }
  .nav a { display: flex; align-items: center; gap: 7px; padding: 0 10px; color: var(--muted); text-decoration: none; font-weight: 500; white-space: nowrap;
    border-bottom: 2px solid transparent; margin-bottom: -1px; }
  .nav a:hover { color: var(--fg); }
  .nav a[aria-current="page"] { color: var(--fg); border-bottom-color: var(--accent); }
  .nav svg { width: 16px; height: 16px; flex: none; }
  .nav .short { display: none; }
  .nav .count { font: 500 .72rem var(--font-mono); color: var(--muted); border: 1px solid var(--line); border-radius: 3px; padding: 0 4px; }
  .me { margin-left: auto; display: flex; align-items: center; gap: 10px; font-size: .88rem; color: var(--muted); flex: none; }
  .avatar { width: 24px; height: 24px; border-radius: 50%; object-fit: cover; flex: none; background: var(--surface-2); }
  main { min-width: 0; }
  .view { max-width: 1160px; margin: 0 auto; padding-block: 24px 64px;
    padding-left: max(24px, env(safe-area-inset-left, 0px)); padding-right: max(24px, env(safe-area-inset-right, 0px));
    display: flex; flex-direction: column; gap: 18px; }
  .view-head { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px; padding-bottom: 14px; border-bottom: 1px solid var(--line); }
  .view-head .sub { color: var(--muted); margin-top: 2px; max-width: 70ch; }
  @media (max-width: 760px) {
    .topnav .inner { flex-wrap: wrap; height: auto; gap: 0 12px; padding-top: 8px;
      padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
    .nav { order: 3; flex-basis: 100%; height: 40px; margin-inline: -10px; }
    .nav svg, .nav .long { display: none; }
    .nav .short { display: inline; }
    .me span.name { display: none; }
    .view { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 16px 48px; }
  }

  /* Building blocks */
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 16px; min-width: 0; }
  .stack { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .grid-2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px; }
  .grid-3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; }
  .label { font-size: .75rem; font-weight: 500; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
  .muted { color: var(--muted); }
  .small { font-size: .86rem; }
  .mono { font-family: var(--font-mono); font-size: .82rem; }
  .btn { display: inline-flex; align-items: center; gap: 6px; border-radius: 4px; padding: 6px 12px; cursor: pointer; border: 1px solid var(--line-strong);
    background: var(--surface); color: var(--fg); font-weight: 500; text-decoration: none; white-space: nowrap; line-height: 1.4; }
  .btn:hover { background: var(--surface-2); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
  .btn.primary:hover { filter: brightness(1.1); }
  .btn.ghost { border-color: transparent; background: transparent; color: var(--link); padding-inline: 4px; }
  .btn.danger { color: var(--danger); }
  .btn:disabled { opacity: .5; cursor: not-allowed; }
  .btn svg { width: 15px; height: 15px; }
  .field { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
  .field label { font-weight: 500; font-size: .88rem; }
  input[type="text"], input[type="password"], textarea, select { width: 100%; padding: 7px 10px; border: 1px solid var(--line-strong); border-radius: 4px; background: var(--surface); }
  textarea { min-height: 150px; resize: vertical; line-height: 1.5; }
  .notice { background: var(--warn-bg); color: var(--warn-fg); border: 1px solid var(--warn-line); border-radius: 4px; padding: 9px 12px; font-size: .88rem; }
  .error { color: var(--danger); }
  /* Status: a small square and plain text, as on a lab report. */
  .pill { display: inline-flex; align-items: center; gap: 6px; font-size: .82rem; font-weight: 600; color: var(--unlikely); text-transform: capitalize; }
  .pill::before { content: ""; width: 8px; height: 8px; border-radius: 1px; background: currentColor; }
  .pill[data-tone="likely"] { color: var(--likely); }
  .pill[data-tone="possible"] { color: var(--possible); }
  .pill[data-tone="open"] { color: var(--open); }
  .chip { font-size: .8rem; color: var(--muted); white-space: nowrap; }
  .chip + .chip::before, .pill + .chip::before { content: "·"; margin-right: 8px; color: var(--faint); }
  dl.facts { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 6px 18px; margin: 0; }
  dl.facts dt { color: var(--muted); } dl.facts dd { margin: 0; overflow-wrap: anywhere; }
  ul.list { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 4px; }
  .empty { padding: 28px 16px; display: flex; flex-direction: column; align-items: flex-start; gap: 8px; }
  .empty svg { display: none; }
  .empty p { max-width: 60ch; color: var(--muted); }
  details summary { cursor: pointer; color: var(--link); }
  details[open] summary { margin-bottom: 8px; }
  .clickable { cursor: pointer; text-decoration: none; color: inherit; display: block; }
  .clickable:hover { border-color: var(--line-strong); background: var(--surface-2); }
  .section-title { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }

  /* Overview */
  .source { display: flex; flex-wrap: wrap; gap: 4px 20px; font-size: .86rem; color: var(--muted); padding: 10px 14px; background: var(--surface); border: 1px solid var(--line); border-radius: 6px; }
  .source b { color: var(--fg); font-weight: 600; font-variant-numeric: tabular-nums; }
  .steps-list { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 6px; }
  .scope { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px; }

  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); border: 1px solid var(--line); border-radius: 6px; background: var(--surface); }
  .kpi { display: flex; flex-direction: column; gap: 2px; padding: 14px 16px; text-decoration: none; color: var(--muted); border-right: 1px solid var(--line); font-size: .86rem; }
  .kpi:last-child { border-right: 0; }
  .kpi:hover { background: var(--surface-2); }
  .kpi b { font-size: 1.5rem; font-weight: 600; color: var(--fg); font-variant-numeric: tabular-nums; }
  .kpi-inline b { font-size: 1.4rem; font-weight: 600; font-variant-numeric: tabular-nums; }
  .bars { display: flex; flex-direction: column; gap: 2px; }
  .bar-row { display: grid; grid-template-columns: minmax(90px, 150px) minmax(0, 1fr) 36px; gap: 10px; align-items: center; padding: 4px 6px; margin: 0 -6px;
    border: 0; background: none; text-align: left; border-radius: 3px; font-size: .86rem; color: var(--fg); }
  button.bar-row { cursor: pointer; } button.bar-row:hover { background: var(--surface-2); }
  .bar-label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .bar-track { height: 8px; background: var(--surface-2); border-radius: 2px; overflow: hidden; }
  .bar-fill { display: block; height: 100%; background: var(--accent); border-radius: 2px; }
  .bar-n { text-align: right; color: var(--muted); font-variant-numeric: tabular-nums; }
  .role-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 12px; max-width: 760px; }
  .role-card { display: flex; flex-direction: column; gap: 4px; text-align: left; padding: 16px; border: 1px solid var(--line-strong); border-radius: 6px; background: var(--surface); cursor: pointer; }
  .role-card:hover { background: var(--surface-2); }
  .role-card[aria-pressed="true"] { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); background: var(--accent-soft); }
  .dir-row { border-bottom: 1px solid var(--line); }
  .dir-row:last-child { border-bottom: 0; }
  .dir-row > summary { list-style: none; cursor: pointer; padding: 12px 16px; display: flex; flex-direction: column; gap: 3px; color: var(--fg); }
  .dir-row > summary::-webkit-details-marker { display: none; }
  .dir-row > summary:hover { background: var(--surface-2); }
  .dir-title { font-weight: 500; }
  .dir-body { padding: 0 16px 16px; }

  .meter { display: flex; height: 8px; border-radius: 2px; overflow: hidden; background: var(--surface-2); }
  .meter .m-pass { background: var(--likely); } .meter .m-unknown { background: var(--possible); } .meter .m-fail { background: var(--danger); }
  .crit { display: grid; grid-template-columns: 26px minmax(0, 1fr); gap: 10px; padding: 12px 16px; border-bottom: 1px solid var(--line); }
  .crit:last-child { border-bottom: 0; }
  .crit-mark { width: 22px; height: 22px; border-radius: 3px; display: grid; place-items: center; font-weight: 600; font-size: .8rem; color: var(--surface); background: var(--likely); }
  .crit[data-status="unknown"] .crit-mark { background: var(--possible); } .crit[data-status="fail"] .crit-mark { background: var(--danger); }
  .crit-status { font-size: .78rem; font-weight: 600; color: var(--likely); text-transform: uppercase; letter-spacing: .04em; }
  .crit[data-status="unknown"] .crit-status { color: var(--possible); } .crit[data-status="fail"] .crit-status { color: var(--danger); }
  .tracker { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
  .tracker li { display: flex; gap: 10px; align-items: center; padding: 6px 0; position: relative; }
  .tracker li[data-done="true"] > span { color: var(--fg); } .tracker li[data-done="false"] > span { color: var(--muted); }
  .tick { width: 22px; height: 22px; flex: none; border: 1px solid var(--line-strong); border-radius: 3px; background: var(--surface); cursor: pointer; font-size: .8rem; font-weight: 600; color: var(--accent-fg); padding: 0; }
  .tick[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); }
  #enr-photo { position: absolute; width: 1px; height: 1px; opacity: 0; }

  .journey { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; }
  .journey li { display: flex; gap: 10px; align-items: flex-start; }
  .j-num { width: 24px; height: 24px; flex: none; border-radius: 50%; display: grid; place-items: center; font-size: .8rem; font-weight: 600; border: 1px solid var(--line-strong); color: var(--muted); background: var(--surface); }
  .journey li[data-state="done"] .j-num { background: var(--likely); border-color: var(--likely); color: var(--surface); }
  .journey li[data-state="current"] .j-num { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
  .j-title { font-weight: 600; font-size: .9rem; color: var(--fg); }
  a.j-title { color: var(--link); }
  .journey li[data-state="todo"] .j-title { color: var(--muted); font-weight: 500; }
  .near { display: flex; flex-direction: column; }
  .near-row { display: flex; flex-direction: column; gap: 2px; padding: 9px 0; border-top: 1px solid var(--line); text-decoration: none; color: inherit; }
  .near-row:first-child, .near .notice + .near-row { border-top: 0; padding-top: 0; }
  .near .notice { margin-bottom: 10px; }
  .near-row:hover .near-title { text-decoration: underline; }
  .near-title { font-weight: 500; color: var(--link); }
  .faq { border-top: 1px solid var(--line); padding-top: 8px; }
  .faq summary { color: var(--fg); font-weight: 500; }
  .todo { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
  .todo li { display: flex; gap: 10px; align-items: center; }
  .todo-box { width: 18px; height: 18px; flex: none; border: 1px solid var(--line-strong); border-radius: 3px; display: grid; place-items: center; font-size: .72rem; color: var(--surface); }
  .todo li[data-done="true"] .todo-box { background: var(--likely); border-color: var(--likely); }
  .todo li[data-done="true"] > span:last-child { color: var(--muted); text-decoration: line-through; }

  /* Trials */
  .trial { display: flex; flex-direction: column; gap: 8px; }
  .trial .t-title { font-weight: 600; }
  .steps { display: flex; flex-direction: column; gap: 6px; }
  .steps div { color: var(--muted); display: flex; gap: 8px; align-items: center; }
  .steps div[data-state="active"] { color: var(--fg); font-weight: 500; }
  .dot { width: 7px; height: 7px; border-radius: 1px; background: var(--line-strong); flex: none; }
  .steps div[data-state="active"] .dot { background: var(--accent); animation: pulse 1.2s ease-in-out infinite; }
  .steps div[data-state="done"] .dot { background: var(--likely); }
  @keyframes pulse { 50% { opacity: .3; } }
  @media (prefers-reduced-motion: reduce) { .steps div[data-state="active"] .dot { animation: none; } }

  /* Tumor board */
  .opinion { display: flex; gap: 12px; align-items: flex-start; }
  .opinion .body { display: flex; flex-direction: column; gap: 6px; min-width: 0; flex: 1; }
  .opinion .who { display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: baseline; }
  .opinion .who b { font-weight: 600; }
  .brief { background: var(--surface-2); }
  .split { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); gap: 18px; align-items: start; }
  @media (max-width: 900px) { .split { grid-template-columns: minmax(0, 1fr); } }
  .tablewrap { overflow-x: auto; }
  table { border-collapse: collapse; width: 100%; font-size: .9rem; }
  th, td { text-align: left; padding: 8px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { font-size: .74rem; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; font-weight: 500; background: var(--surface-2); }
  tr:last-child td { border-bottom: 0; }
  tr.rowlink { cursor: pointer; } tr.rowlink:hover td { background: var(--surface-2); }
  footer.foot { max-width: 1160px; margin: 0 auto; padding-block: 0 32px; font-size: .8rem; color: var(--faint);
    padding-left: max(24px, env(safe-area-inset-left, 0px)); padding-right: max(24px, env(safe-area-inset-right, 0px)); }
</style>

<div class="app">
  <header class="topnav">
    <div class="inner">
      <a class="brand" href="#home" aria-label="Eligo home">
        <svg width="24" height="24" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="6" fill="var(--accent)"/><path d="M7 16H21A7.5 7.5 0 1 0 18.8 21.3" stroke="var(--accent-fg)" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M21 16H23.2" stroke="var(--accent-fg)" stroke-width="3" stroke-linecap="round"/><circle cx="26.4" cy="16" r="2.3" fill="var(--accent-fg)"/></svg>
        <b>Eligo</b>
      </a>
      <nav class="nav" id="side-nav" aria-label="Sections"></nav>
      <div class="me" id="me-box"></div>
    </div>
  </header>
  <main><div id="view"></div></main>
  <footer class="foot" id="foot"></footer>
</div>

<script>
/* ---------------- constants ---------------- */
const ICONS = {
  home: '<path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/>',
  match: '<circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3M8 11h6M11 8v6"/>',
  patients: '<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0M16 4.5a3.5 3.5 0 0 1 0 7M21.5 20a6.5 6.5 0 0 0-4-6"/>',
  boards: '<rect x="3" y="4" width="18" height="13" rx="2"/><path d="M7 21h10M12 17v4M7 9h6M7 12h10"/>',
  plus: '<path d="M12 5v14M5 12h14"/>',
  back: '<path d="M15 18l-6-6 6-6"/>',
  doc: '<path d="M7 3h7l5 5v13H7z"/><path d="M14 3v5h5M10 13h6M10 17h6"/>',
  globe: '<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/>',
  chat: '<path d="M4 5h16v11H9l-5 4z"/>',
  spark: '<path d="M12 3v4M12 17v4M3 12h4M17 12h4M6 6l2.5 2.5M15.5 15.5L18 18M6 18l2.5-2.5M15.5 8.5L18 6"/>',
  trials: '<path d="M9 3h6M10 3v6l-5.5 9.5A2 2 0 0 0 6.2 21h11.6a2 2 0 0 0 1.7-2.5L14 9V3"/><path d="M7.5 15h9"/>',
  mytrials: '<path d="M12 21s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 11c0 5.6-7 10-7 10z"/>',
  user: '<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>',
};
const icon = (name) => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[name]}</svg>`;
// Sections per role: [route, label, short label for phones]
const NAV_CLINICAL = [["home", "Home", "Home"], ["match", "Matcher", "Match"], ["patients", "Patients", "Patients"], ["boards", "Tumor boards", "Boards"], ["trials", "Trials", "Trials"]];
const NAV_PATIENT = [["home", "Home", "Home"], ["mytrials", "My trials", "My trials"], ["trials", "All trials", "All trials"]];
const CLINICAL_ROUTES = new Set(["match", "patients", "patient", "boards", "board"]);
const CLINICAL_TITLES = ["Medical oncologist", "Hematologist", "Surgical oncologist", "Radiation oncologist", "Pathologist", "Radiologist", "Principal investigator", "Trial coordinator", "Research nurse", "Sponsor / CRO", "Other clinician"];

function h(tag, props = {}, ...kids) {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(props || {})) {
    if (v == null || v === false) continue;
    if (k === "class") n.className = v;
    else if (k === "html") n.innerHTML = v;            // only ever used with our own static icon markup
    else if (k.startsWith("on")) n.addEventListener(k.slice(2), v);
    else if (k === "dataset") Object.assign(n.dataset, v);
    else if (k in n && typeof v !== "string") n[k] = v;
    else n.setAttribute(k, v);
  }
  for (const kid of kids.flat()) if (kid != null && kid !== false) n.append(kid instanceof Node ? kid : String(kid));
  return n;
}

function ago(iso) {
  const s = (Date.now() - Date.parse(iso)) / 1000;
  if (!isFinite(s)) return "";
  if (s < 60) return "just now";
  const m = s / 60; if (m < 60) return `${Math.floor(m)} min ago`;
  const hr = m / 60; if (hr < 24) return `${Math.floor(hr)} h ago`;
  const d = hr / 24; if (d < 30) return `${Math.floor(d)} d ago`;
  return new Date(iso).toLocaleDateString();
}

function regionOf(country) {
  if (!country) return null;
  const c = String(country).trim().toLowerCase();
  for (const [r, l] of Object.entries(REGIONS)) if (l.some((x) => x.toLowerCase() === c)) return r;
  return null;
}
function proximity(trial, home) {
  const hm = home?.trim().toLowerCase(), hr = regionOf(home);
  const rank = (c) => (hm && c?.toLowerCase() === hm ? 0 : hr && regionOf(c) === hr ? 1 : 2);
  const sites = [...trial.sites].sort((a, b) => rank(a[2]) - rank(b[2]));
  return { level: ["same_country", "same_region", "abroad"][sites.length ? rank(sites[0][2]) : 2], sites,
    countries: [...new Set(trial.sites.map((s) => s[2]).filter(Boolean))] };
}

1. Extract the case. Only state what the text says; use null or [] when it is not stated. Write fields in English except "language", which names the summary's language in English.
2. From the trial index (every recruiting cancer treatment trial with a site in Latin America), choose up to ${MAX_CANDIDATES} trials most worth checking for THIS patient: same cancer type and setting, matching biomarkers, fitting the line of therapy. Best first. Choose none if nothing fits.

Reply with only JSON:
{"case": {"is_cancer_case": true, "language": "Spanish", "summary_en": "two sentences", "cancer_type": "", "stage": null, "biomarkers": [], "prior_treatments": [], "age": null, "sex": "female|male|unknown", "performance_status": null, "country": null, "city": null, "missing_info": ["facts trials usually require that are not stated"]}, "candidates": ["NCT..."]}

<patient_summary>
${text}

}
function assessPrompt(c, picks, lang) {

Rules:
- "likely": no criterion clearly excludes the patient and key inclusion criteria are met. "possible": key facts missing or a doctor must confirm. "unlikely": a criterion clearly excludes the patient.

- plain_summary, patient_message, questions_for_doctor and enrollment_checklist are in ${lang || c.language || "the patient's language"}, simple enough for a family with no medical training.

{"assessments": [{"id": "NCT...", "fit": "likely|possible|unlikely", "reasons_for": [], "reasons_against": [], "to_confirm": [], "plain_summary": ""}], "patient_message": "", "questions_for_doctor": [], "enrollment_checklist": []}

<trials>

}

async function runMatch(M = S.match, lang = null) {
  const text = M.text.trim();
  if (!text) { M.error = "Paste a patient summary first."; return renderView(); }
  if (text.length > 20000) { M.error = "That summary is very long. Shorten it to the key facts."; return renderView(); }
  M.ctl = new AbortController(); M.running = true; M.error = ""; M.result = null; M.step = "read"; renderView();
  try {
    const first = await S.sample.json(readPrompt(text), { signal: M.ctl.signal });
    const c = first?.case;
    if (!c || typeof c !== "object") throw { code: "invalid_json" };
    let matches = [], second = {};
    if (c.is_cancer_case !== false) {
      const ids = [...new Set((Array.isArray(first.candidates) ? first.candidates : []).map(String))].filter((id) => S.byId.has(id)).slice(0, MAX_CANDIDATES);
      const picks = ids.map((id) => { const t = S.byId.get(id); return { t, p: proximity(t, c.country) }; });
      if (picks.length) {
        M.step = "assess"; renderView();
        second = await S.sample.json(assessPrompt(c, picks, lang), { signal: M.ctl.signal }) || {};
        const byId = new Map((second.assessments || []).map((a) => [String(a.id), a]));
        matches = picks.filter(({ t }) => byId.has(t.id)).map(({ t, p }) => {
          const a = byId.get(t.id);
          return { id: t.id, fit: ["likely", "possible", "unlikely"].includes(a.fit) ? a.fit : "possible", proximity: p.level,
            plain_summary: String(a.plain_summary || ""), reasons_for: arr(a.reasons_for), reasons_against: arr(a.reasons_against), to_confirm: arr(a.to_confirm) };
        }).sort((x, y) => FIT_RANK[x.fit] - FIT_RANK[y.fit] || PROX_RANK[x.proximity] - PROX_RANK[y.proximity]);
      }
    }
    M.result = { text, case: c, matches, message: String(second.patient_message || ""), questions: arr(second.questions_for_doctor),
      checklist: arr(second.enrollment_checklist), matched_at: now() };
  } catch (e) {
    M.error = e?.code === "cancelled" ? "Stopped." : sampleError(e);
  } finally {
    M.running = false; M.step = ""; M.ctl = null; renderView();
  }
}

async function checkEligibility(ctx, t, answerLines, signal) {

- "pass": the requirement is satisfied (for an exclusion, the patient clearly does not have that condition)
- "fail": the information clearly shows the patient does not satisfy it
- "unknown": the information is missing or unclear. Never guess lab values, dates or facts that are not stated.

Write "plain", "reason" and "needed" in ${L}, simply, for someone with no medical training. "original" is a short quote of the criterion in English.

{"criteria": [{"id": "c1", "type": "inclusion|exclusion", "plain": "", "original": "", "status": "pass|fail|unknown", "reason": "", "needed": ""}], "summary": "", "questions_for_screening": [], "documents": []}

</trial>`, { signal, cache: false });
  const criteria = (Array.isArray(res?.criteria) ? res.criteria : []).map((c, i) => ({ id: String(c.id || `c${i + 1}`), type: c.type === "exclusion" ? "exclusion" : "inclusion",
    plain: String(c.plain || ""), original: String(c.original || ""), status: ["pass", "fail", "unknown"].includes(c.status) ? c.status : "unknown",
    reason: String(c.reason || ""), needed: String(c.needed || "") }));

  if (raw.startsWith("board-")) return { name: "board", id: raw.slice(6) };

    // Add opinion form
    if (b.status === "open") {
      const d = S.drafts[`op-${b.id}`] ||= { specialty: SPECIALTIES.includes(S.profile?.specialty) ? S.profile.specialty : "Medical oncology", recommendation: "", trials: "" };
      const sel = h("select", { id: "op-specialty", onchange: (e) => { d.specialty = e.target.value; } }, ...SPECIALTIES.map((s) => h("option", { value: s, selected: d.specialty === s }, s)));
      const rec = h("textarea", { id: "op-rec", placeholder: "Your recommendation and reasoning.", oninput: (e) => { d.recommendation = e.target.value; } }); rec.value = d.recommendation;
      const tv = h("textarea", { id: "op-trials", style: "min-height:70px", placeholder: "Optional: which of the matched trials, if any, you'd refer to and why.", oninput: (e) => { d.trials = e.target.value; } }); tv.value = d.trials;
      const msg = h("p", { class: "small error" });
      const post = h("button", { class: "btn primary", disabled: !S.db || !S.canWrite, onclick: async () => {
        if (!d.recommendation.trim()) { msg.textContent = "Write your recommendation first."; return; }
        post.disabled = true;
        try { await addOpinion(b, d); S.drafts[`op-${b.id}`] = null; renderView(); } catch (e) { msg.textContent = dbFail(e); post.disabled = false; }
      } }, ic("chat"), "Post opinion");
      left.append(h("div", { class: "card stack" }, h("h2", {}, "Add your opinion"),
        h("div", { class: "field" }, h("label", { for: "op-specialty" }, "Your specialty"), sel),
        h("div", { class: "field" }, h("label", { for: "op-rec" }, "Recommendation"), rec),
        h("div", { class: "field" }, h("label", { for: "op-trials" }, "On the trials"), tv),
        h("div", { class: "row" }, post, h("span", { class: "muted small" }, "Posted under your name. The treating doctor decides.")), msg));
    }

    // Right column: case + trials
    right.append(h("div", { class: "card stack" }, h("h3", {}, "The case"), caseFacts(b.case || {}),
      h("details", {}, h("summary", {}, "Original summary"), h("p", { class: "small", style: "white-space:pre-wrap" }, b.text || "")),
      h("a", { class: "btn ghost", href: `#patient-${b.patient_id}`, style: "align-self:flex-start;padding-left:0" }, "Open patient profile →")));
    if (b.matches?.length) right.append(h("div", { class: "card stack" }, h("h3", {}, "Matched trials"),
      ...b.matches.map((m) => { const t = S.byId.get(m.id); return h("div", { class: "stack", style: "gap:4px" },
        h("div", { class: "row" }, h("span", { class: "pill", "data-tone": m.fit }, m.fit), h("a", { class: "mono", href: `https://clinicaltrials.gov/study/${encodeURIComponent(m.id)}`, target: "_blank", rel: "noopener" }, m.id)),
        h("span", { class: "small" }, t?.title || "")); })));

    return h("div", { class: "stack", style: "gap:22px" },
      h("a", { class: "btn ghost", href: "#boards", style: "align-self:flex-start;padding-left:0" }, ic("back"), "Tumor boards"),
      head(`Tumor board · ${b.patient_alias || "Patient"}`, [b.case?.cancer_type, b.case?.country, `posted ${ago(b.created_at)}`].filter(Boolean).join(" · "),
        h("span", { class: "pill", "data-tone": b.status }, b.status), (mine || S.me?.isOwner) ? toggle : null),
      h("div", { class: "split" }, left, right));
  }));
}

function viewSettings() {
  const wrap = h("div", { class: "view" }, head("Settings", "This copy of Eligo runs on its own, outside Claude."));
  if (!S.standalone) { wrap.append(h("div", { class: "card" }, h("p", {}, "Inside Claude, Eligo uses your Claude account and a workspace shared with the people you invite. Nothing to set up."))); return wrap; }
  const P = window.EligoStandalone;
  if (!P) { wrap.append(h("p", { class: "error" }, "Couldn't load Eligo's Claude connection. Reload the page; if it keeps happening, download Eligo.html again.")); return wrap; }
  const has = !!P.getKey();
  const input = h("input", { type: "password", id: "api-key", placeholder: has ? "A key is saved. Paste a new one to replace it." : "sk-ant-…", autocomplete: "off", spellcheck: "false" });
  const msg = h("p", { class: "small" });
  wrap.append(h("div", { class: "card stack" }, h("h2", {}, "Anthropic API key"),
    h("p", { class: "muted small" }, "Matching and case briefs call Claude with your own key. It's saved only in this browser and sent only to Anthropic. Get one at console.anthropic.com → API keys, and add a few dollars of credit."),
    h("div", { class: "field" }, h("label", { for: "api-key" }, "API key"), input),
    h("div", { class: "row" },
      h("button", { class: "btn primary", onclick: () => {
        const v = input.value.trim();
        if (!/^sk-ant-/.test(v)) { msg.className = "small error"; msg.textContent = "That doesn't look like an Anthropic key. It starts with sk-ant-."; return; }
        P.setKey(v); S.sample = P.makeSample(v); input.value = ""; msg.className = "small"; msg.textContent = "Saved. You can run the matcher now."; renderShell();
      } }, "Save key"),
      has ? h("button", { class: "btn danger", onclick: () => { P.setKey(""); S.sample = null; renderView(); } }, "Remove key") : null),
    msg),
    h("div", { class: "card stack" }, h("h2", {}, "Where your data lives"),
      h("p", { class: "muted small" }, "Patients and tumor boards you create here are saved in this browser only. To work with other doctors on shared tumor boards, use the Claude version of Eligo and share it with them."),
      h("p", { class: "muted small" }, "Never paste real names or ID numbers. Use initials or a code.")));
  return wrap;
}

/* ---------------- boot ---------------- */
renderShell(); renderView();

(async () => {
  try {
    // The single-file build (Eligo.html) carries the snapshot inline; the website and Claude versions fetch it.
    const data = window.ELIGO_TRIALS || await (await fetch("trials.json")).json();
    S.trials = data.trials; S.byId = new Map(S.trials.map((t) => [t.id, t])); S.snapshotDate = data.generated_at;
    S.countries = new Set(S.trials.flatMap((t) => t.sites.map((s) => s[2]))).size;
  } catch { S.snapshotDate = ""; }
  scheduleRender();
})();

(async () => {
  if (!window.claude) return bootStandalone();
  setTimeout(() => { if (!S.profileLoaded && !S.db) { S.profileLoaded = true; scheduleRender(); } }, 12000);
  const [sample, db, user] = await Promise.all([claude.use("sample"), claude.use("db"), claude.use("user")]);
  S.sample = sample; S.user = user;
  if (user) { S.me = await user.me(); const cw = await user.can("data.write"); if (cw === false) S.canWrite = false; }
  if (db) {
    S.db = db;
    const timer = setTimeout(() => { if (!S.loaded.patients) { S.dbError = "Can't reach saved data yet. Check your connection; it will load when it can."; scheduleRender(); } }, 10000);
    const sub = (name, q, key) => q.onSnapshot((snap) => {
      S[key] = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
      if (!snap.metadata.fromCache) { S.loaded[key] = true; if (key === "patients") { clearTimeout(timer); S.dbError = ""; } }
      else if (snap.size) S.loaded[key] = true;
      scheduleRender();
    }, (e) => { S.loaded[key] = true; if (e?.code !== "revoked") S.dbError = "Saved data couldn't load. Reload to try again."; clearTimeout(timer); scheduleRender(); });
    sub("patients", db.collection("patients").orderBy("updated_at", "desc"), "patients");
    sub("boards", db.collection("boards").orderBy("created_at", "desc"), "boards");
    sub("opinions", db.collection("opinions").orderBy("created_at", "asc"), "opinions");
    sub("enrollments", db.collection("enrollments").orderBy("updated_at", "desc"), "enrollments");
    watchMembers(db);
    // Each person's profile and saved matches live in their own private space: nobody else can read it.
    if (S.me?.id) watchMine(db, `data/users/${S.me.id}`);
    else { S.profileLoaded = true; }
  } else { S.profileLoaded = true; }
  scheduleRender();
})();

function watchMine(db, coll) {
  S.myColl = coll;
  db.collection(coll).onSnapshot((snap) => {
    const byId = Object.fromEntries(snap.docs.map((d) => [d.id, d.data()]));
    S.profile = byId.profile || null; S.myMatch = byId.match || null; S.myFacts = byId.facts?.items || [];
    S.myEnroll = Object.fromEntries(snap.docs.filter((d) => d.id.startsWith("enroll-")).map((d) => [d.id.slice(7), { id: d.id, ...d.data() }]));
    if (!snap.metadata.fromCache || snap.size) S.profileLoaded = true;
    scheduleRender();
  }, () => { S.profileLoaded = true; scheduleRender(); });
  setTimeout(() => { if (!S.profileLoaded) { S.profileLoaded = true; scheduleRender(); } }, 10000);
}
function watchMembers(db) {
  db.collection("members").onSnapshot((snap) => { S.members = Object.fromEntries(snap.docs.map((d) => [d.id, d.data()])); scheduleRender(); }, () => {});
}

/* Outside Claude (GitHub Pages, a local file server): your own API key, data in this browser. */
async function bootStandalone() {
  S.standalone = true;
  if (!window.EligoStandalone) await new Promise((resolve) => {
    const s = document.createElement("script");
    s.src = "standalone.js"; s.onload = resolve; s.onerror = resolve;
    document.head.append(s);
  });
  const P = window.EligoStandalone;
  if (!P) { S.profileLoaded = true; scheduleRender(); return; }
  const key = P.getKey();
  S.sample = key ? P.makeSample(key) : null;
  S.user = P.makeUser(); S.me = await S.user.me();
  const db = P.makeDb(); S.db = db;
  for (const [key, field, dir] of [["patients", "updated_at", "desc"], ["boards", "created_at", "desc"], ["opinions", "created_at", "asc"], ["enrollments", "updated_at", "desc"]]) {
    db.collection(key).orderBy(field, dir).onSnapshot((snap) => {
      S[key] = snap.docs.map((d) => ({ id: d.id, ...d.data() })); S.loaded[key] = true; scheduleRender();
    });
  }
  watchMembers(db);
  watchMine(db, "me");
  scheduleRender();
}
</script>
